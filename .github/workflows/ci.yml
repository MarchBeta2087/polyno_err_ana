name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev
      - name: 依赖校验
        run: bash scripts/verify-deps.sh
      - name: 缓存 numextend 构建
        uses: actions/cache@v6
        with:
          path: numextend/build
          key: nex-${{ runner.os }}-${{ hashFiles('numextend/CMakeLists.txt', 'numextend/nex/**', 'numextend/cmake/**') }}
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(nproc)"
      - name: 构建 polyno_err_ana
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: 回归
        run: ctest --test-dir build --output-on-failure
      - name: 性能门禁（宽松阈值，拦灾难性回归）
        run: bash scripts/bench_gate.sh ./build/polyno_err_ana 5
      - name: 构建（MPFR 内核）
        run: |
          cmake -S . -B build-mpfr -DCMAKE_BUILD_TYPE=Release -DPOLYNO_ENABLE_MPFR=ON
          cmake --build build-mpfr -j"$(nproc)"
      - name: 回归（MPFR 内核）
        run: ctest --test-dir build-mpfr --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
      - name: 缓存 numextend 构建
        uses: actions/cache@v6
        with:
          path: numextend/build
          key: nex-${{ runner.os }}-${{ hashFiles('numextend/CMakeLists.txt', 'numextend/nex/**', 'numextend/cmake/**') }}
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j4
      - name: 构建 polyno_err_ana
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: 回归
        run: ctest --test-dir build --output-on-failure
      - name: 构建（MPFR 内核，ucrt64 包）
        run: |
          cmake -S . -B build-mpfr -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release                 -DPOLYNO_ENABLE_MPFR=ON -DPNA_THIRD_PARTY=/ucrt64
          cmake --build build-mpfr -j4
      - name: 回归（MPFR 内核）
        run: ctest --test-dir build-mpfr --output-on-failure
        run: |
          cmake -S numextend -B numextend/build-universal -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build numextend/build-universal -j"$(sysctl -n hw.ncpu)"
          cmake -S . -B build-universal -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"                 -DNEX_LIB="$PWD/numextend/build-universal/libnex.a"
          cmake --build build-universal -j"$(sysctl -n hw.ncpu)"
          lipo -info build-universal/polyno_err_ana
          ctest --test-dir build-universal --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 依赖
        run: brew install gmp mpfr
      - name: 缓存 numextend 构建
        uses: actions/cache@v6
        with:
          path: numextend/build
          key: nex-${{ runner.os }}-${{ hashFiles('numextend/CMakeLists.txt', 'numextend/nex/**', 'numextend/cmake/**') }}
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(sysctl -n hw.ncpu)"
      - name: 构建 polyno_err_ana
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: 回归
        run: ctest --test-dir build --output-on-failure
      - name: 性能门禁（宽松阈值，拦灾难性回归）
        run: bash scripts/bench_gate.sh ./build/polyno_err_ana 5
      - name: 构建（MPFR 内核）
        run: |
          cmake -S . -B build-mpfr -DCMAKE_BUILD_TYPE=Release -DPOLYNO_ENABLE_MPFR=ON -DPNA_THIRD_PARTY="$(brew --prefix)"
          cmake --build build-mpfr -j"$(sysctl -n hw.ncpu)"
      - name: 回归（MPFR 内核）
        run: ctest --test-dir build-mpfr --output-on-failure
      - name: 通用二进制冒烟（arm64+x86_64）
        run: |
          cmake -S numextend -B numextend/build-universal -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build numextend/build-universal -j"$(sysctl -n hw.ncpu)"
          cmake -S . -B build-universal -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"                 -DNEX_LIB="$PWD/numextend/build-universal/libnex.a"
          cmake --build build-universal -j"$(sysctl -n hw.ncpu)"
          lipo -info build-universal/polyno_err_ana
          ctest --test-dir build-universal --output-on-failure
