name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgmp-dev libmpfr-dev
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(nproc)"
      - name: 构建 polyno_err_ana
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: 回归
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j4
      - name: 构建 polyno_err_ana
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: 回归
        run: ctest --test-dir build --output-on-failure
