name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(nproc)"
      - name: 构建（静态运行库）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPOLYNO_STATIC_RUNTIME=ON
          cmake --build build -j"$(nproc)"
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  linux-mpfr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make m4 curl xz-utils
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(nproc)"
      - name: 获取并构建 GMP/MPFR（静态）
        run: |
          scripts/fetch-gmp.sh
          scripts/fetch-mpfr.sh
          scripts/build-mpfr.sh "$PWD/third_party_prefix"
      - name: 构建（MPFR 内核，静态运行库）
        run: |
          cmake -S . -B build-mpfr -DCMAKE_BUILD_TYPE=Release \
                -DPOLYNO_ENABLE_MPFR=ON -DPOLYNO_STATIC_RUNTIME=ON \
                -DPNA_THIRD_PARTY="$PWD/third_party_prefix"
          cmake --build build-mpfr -j"$(nproc)"
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-linux-x86_64-mpfr"
          mkdir -p "dist/$pkg"
          cp build-mpfr/polyno_err_ana "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-mpfr
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j4
      - name: 构建（静态运行库）
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release \
                -DPOLYNO_STATIC_RUNTIME=ON
          cmake --build build -j4
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-windows-x86_64"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana.exe "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          cd dist && zip -qr "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  windows-mpfr:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j4
      - name: 构建（MPFR 内核，静态运行库，显式 .a）
        run: |
          cmake -S . -B build-mpfr -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release \
                -DPOLYNO_ENABLE_MPFR=ON -DPOLYNO_STATIC_RUNTIME=ON \
                -DPNA_THIRD_PARTY=/ucrt64 \
                -DMPFR_LIBRARY=/ucrt64/lib/libmpfr.a -DGMP_LIBRARY=/ucrt64/lib/libgmp.a
          cmake --build build-mpfr -j4
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-windows-x86_64-mpfr"
          mkdir -p "dist/$pkg"
          cp build-mpfr/polyno_err_ana.exe "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          cd dist && zip -qr "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-mpfr
          path: dist/*.zip

  macos-universal:
    # 通用二进制（arm64 + x86_64）：只需 arm64 runner 构建，Intel 无需单独排队
    if: github.event.repository.private == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 构建 numextend（通用）
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build numextend/build -j"$(sysctl -n hw.ncpu)"
      - name: 构建（静态运行库，通用）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release                 -DPOLYNO_STATIC_RUNTIME=ON                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"                 -DNEX_LIB="$PWD/numextend/build/libnex.a"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: 校验架构
        run: |
          lipo -info build/polyno_err_ana | tee /dev/stderr | grep -q 'x86_64'
          lipo -info build/polyno_err_ana | grep -q 'arm64'
      - name: 回归（arm64 上运行通用二进制）
        run: ctest --test-dir build --output-on-failure
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-macos-universal2"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal2
          path: dist/*.tar.gz

  publish:
    # 等所有平台完成再发布：macOS 作业在私有仓库会被 skip（needs 中的 skip 视作通过）
    needs: [linux, linux-mpfr, windows, windows-mpfr, macos-universal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 校验和
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} . \;
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          allow_empty: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            默认构建（`numextend` 内核）与可选 `-mpfr` 构建（MPFR 内核），均为静态运行库单文件。

            | 平台 | 默认（numextend） | 可选（mpfr） |
            | --- | --- | --- |
            | Linux x86_64 | `...-linux-x86_64.tar.gz` | `...-linux-x86_64-mpfr.tar.gz` |
            | Windows x86_64 | `...-windows-x86_64.zip` | `...-windows-x86_64-mpfr.zip` |
            | macOS（通用） | `...-macos-universal2.tar.gz`（arm64 + x86_64 单一二进制） | — |

            校验和见 `SHA256SUMS.txt`；
            `-V` 可确认实际内核；用法见包内 `README.md` 与 `EXAMPLES.md`。
            平台支持等级见 `PLATFORMS.md`（Tier 1：Linux/Windows/macOS 通用二进制；Tier 2：macOS Intel 运行期未实测；
            Tier 3：BSD 源码构建；Tier 4：其余）。
            静态链接的 MPFR/GMP 属 LGPL，义务说明见包内 `THIRD_PARTY.md`。
