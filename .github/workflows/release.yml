name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(nproc)"
      - name: 构建（静态运行库）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPOLYNO_STATIC_RUNTIME=ON
          cmake --build build -j"$(nproc)"
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            zip
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j4
      - name: 构建（静态运行库）
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release \
                -DPOLYNO_STATIC_RUNTIME=ON
          cmake --build build -j4
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-windows-x86_64"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana.exe "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          cd dist && zip -qr "$pkg.zip" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  macos:
    # 公开仓库的 macOS runner 免费；私有仓库排队不稳，故仅在公开时执行
    if: github.event.repository.private == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: 构建 numextend
        run: |
          cmake -S numextend -B numextend/build -DCMAKE_BUILD_TYPE=Release
          cmake --build numextend/build -j"$(sysctl -n hw.ncpu)"
      - name: 构建（静态运行库）
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPOLYNO_STATIC_RUNTIME=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: 打包
        run: |
          pkg="polyno_err_ana-${GITHUB_REF_NAME}-macos-$(uname -m)"
          mkdir -p "dist/$pkg"
          cp build/polyno_err_ana "dist/$pkg/"
          cp LICENSE.md README.md THIRD_PARTY.md FAQ.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.tar.gz

  publish:
    # 等三个平台都完成再发布：macOS 作业在私有仓库会被 skip（needs 中的 skip 视作通过），
    # 公开仓库则会等待它，避免 publish 抢跑导致 mac 包漏传。
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 校验和
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} . \;
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          allow_empty: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            构建：Linux(manylinux 兼容性不保证) / Windows(x86_64, UCRT64) / macOS(arm64)。
            运行库已静态链接（`-DPOLYNO_STATIC_RUNTIME=ON`），单文件即可运行。
            校验和见 `SHA256SUMS.txt`；用法见包内 `README.md`。
